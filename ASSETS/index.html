<!DOCTYPE html>
<head>
    <title>* A survey approaches.</title>
    <style>
        @font-face {
            font-family: 'mainfont';
            src: url('ASSETS/8bitoperator_jve.ttf');
        }

        :root{
            --bg:#000000;
            --text:#ffffff;
            --dim:#4a4a4a;
        }

        *{ box-sizing:border-box; }

        html,body{
            margin:0;
            height:100%;
            background:var(--bg);
            color:var(--text);
            font-family: 'mainfont', sans-serif;
            overflow:hidden;
        }

        .stage{
            height:100vh;
            width:100vw;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
        }

        .center{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:12px;
            text-align:center;
            padding:0 20px;
        }

        .qtext{
            font-size:24px;
            letter-spacing:.5px;
        }

        input[type="text"],
        input[type="email"]{
            background:transparent;
            border:1px solid var(--dim);
            color:var(--text);
            font-family: 'mainfont', sans-serif;
            font-size:24px;
            text-align:center;
            padding:6px 10px;
            line-height:1;
            width:280px;
            outline:none;
            margin-top:14px;
        }
        input:focus{ border-color:var(--text); }
        ::placeholder{ color:var(--dim); text-transform:uppercase; font-family: 'mainfont', sans-serif; }

        .action{
            background:none;
            border:none;
            color:var(--text);
            font-family: 'mainfont', sans-serif;
            font-size:24px;
            letter-spacing:1px;
            cursor:pointer;
            padding:6px 4px;
            margin-top:4px;
        }
        .action:hover, .action:focus-visible{ color:var(--dim); outline:none; }
        .action:disabled{ color:var(--dim); cursor:default; }

        .hidden{ display:none !important; }

        .ellipsis{
            font-size:16px;
            letter-spacing:8px;
        }
        .ellipsis span{
            opacity:0;
            animation:blip 1.2s infinite;
        }
        .ellipsis span:nth-child(1){ animation-delay:0s; }
        .ellipsis span:nth-child(2){ animation-delay:.25s; }
        .ellipsis span:nth-child(3){ animation-delay:.5s; }
        @keyframes blip{
            0%{ opacity:0; }
            30%{ opacity:1; }
            60%{ opacity:1; }
            100%{ opacity:0; }
        }
    </style>
</head>

<body>

    <div class="stage">

        <div class="center" id="questionArea">

            <div class="q" data-index="0">
                <div class="qtext">What is your name?</div>
                <input type="text" id="q0" placeholder="INSERT ANSWER" autocomplete="off">
            </div>

            <div class="q hidden" data-index="1">
                <div class="qtext">Where can we reach you?</div>
                <input type="email" id="q1" placeholder="INSERT ANSWER" autocomplete="off">
            </div>

            <div class="q hidden" data-index="2">
                <div class="qtext">What did you enjoy the most?</div>
                <input type="text" id="q2" placeholder="INSERT ANSWER" autocomplete="off">
            </div>

            <button type="button" class="action" id="nextBtn">SUBMIT</button>
        </div>

        <div class="center hidden" id="ellipsisArea">
            <div class="ellipsis"><span>.</span><span>.</span><span>.</span></div>
        </div>

        <div class="center hidden" id="doneArea">
            <div class="qtext" id="doneName"></div>
            <div class="qtext">THANK YOU FOR YOUR TIME.</div>
        </div>

    </div>

    <form id="realForm" action="https://formsubmit.co/f411e6b5a4cdd4700f619fe2cd849df0" method="POST" class="hidden">
        <input type="hidden" name="_subject" value="SURVEY RESULTS">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="Name">
        <input type="hidden" name="Email">
        <input type="hidden" name="Favorite">
    </form>

    <script>
        const questions = Array.from(document.querySelectorAll('.q'));
        const nextBtn = document.getElementById('nextBtn');
        const questionArea = document.getElementById('questionArea');
        const ellipsisArea = document.getElementById('ellipsisArea');
        const doneArea = document.getElementById('doneArea');

        let current = 0;
        const TRANSITION_DELAY = 900;

        function currentAnswer(index){
            const el = document.getElementById('q' + index);
            return el.value;
        }

        function isRequiredEmpty(index){
            if(index === 0) return currentAnswer(0).trim() === '';
            return false;
        }

        function showQuestion(index){
            questions.forEach(q => q.classList.add('hidden'));
            const q = questions[index];
            q.classList.remove('hidden');
            nextBtn.textContent = (index === questions.length - 1) ? 'SUBMIT' : 'NEXT';

            const focusable = q.querySelector('input[type="text"], input[type="email"]');
            if(focusable) setTimeout(() => focusable.focus(), 50);
        }

        function goNext(){
            if(isRequiredEmpty(current)){
                flashRequired();
                return;
            }

            if(current === questions.length - 1){
                submitAll();
                return;
            }

            questionArea.classList.add('hidden');
            ellipsisArea.classList.remove('hidden');

            setTimeout(() => {
                current += 1;
                showQuestion(current);
                ellipsisArea.classList.add('hidden');
                questionArea.classList.remove('hidden');
            }, TRANSITION_DELAY);
        }

        function flashRequired(){
            const q = questions[current];
            const field = q.querySelector('input[type="text"], input[type="email"]');
            if(!field) return;
            field.style.borderColor = '#ffffff';
            field.placeholder = 'REQUIRED';
            setTimeout(() => { field.style.borderColor = ''; }, 400);
        }

        function submitAll(){
            document.querySelector('#realForm input[name="Name"]').value = currentAnswer(0);
            document.querySelector('#realForm input[name="Email"]').value = currentAnswer(1);
            document.querySelector('#realForm input[name="Favorite"]').value = currentAnswer(2);

            document.getElementById('doneName').textContent = '"' + currentAnswer(0).toUpperCase() + '."';

            questionArea.classList.add('hidden');
            ellipsisArea.classList.add('hidden');
            doneArea.classList.remove('hidden');

            setTimeout(() => {
                document.getElementById('realForm').submit();
            }, TRANSITION_DELAY);
        }

        nextBtn.addEventListener('click', goNext);

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !questionArea.classList.contains('hidden')){
                const active = document.activeElement;
                if(active.tagName !== 'TEXTAREA'){
                    e.preventDefault();
                    goNext();
                }
            }
        });

        showQuestion(0);
    </script>

</body>

</html>
